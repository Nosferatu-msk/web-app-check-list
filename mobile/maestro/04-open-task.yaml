# Maestro E2E тест: Открытие задачи
# Проверяет что можно открыть задачу из визита

appId: ru.checkonout.mobile
---
- runFlow:
    when:
      notVisible: "Синхронизировано"
    commands:
      - tapOn: "Чек-лист инженера"
      - extendedWaitUntil:
          visible: "Войдите в систему"
          timeout: 15000

# Обработка экрана блокировки (биометрия)
- runFlow:
    when:
      visible: "Приложение заблокировано"
    commands:
      - tapOn: "Выйти из аккаунта"
      - extendedWaitUntil:
          visible: "Войдите в систему"
          timeout: 5000

# Обработка экрана логина
- runFlow:
    when:
      visible: "Войдите в систему"
    commands:
      - tapOn: "Email"
      - inputText: "testic@test.ru"
      - hideKeyboard
      - tapOn: "Пароль"
      - inputText: "hello2026"
      - hideKeyboard
      - tapOn: "Войти"

# Ожидание списка визитов
- extendedWaitUntil:
    visible: "Синхронизировано"
    timeout: 15000

# Нажатие на первый визит (если есть)
- tapOn:
    point: "50%,30%"
- extendedWaitUntil:
    visible: "Задачи"
    timeout: 5000

# Проверка что экран визита открылся
- assertVisible: "Задачи"

# Назад к списку визитов
- back
- extendedWaitUntil:
    visible: "Синхронизировано"
    timeout: 5000
