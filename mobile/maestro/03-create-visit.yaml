# Maestro E2E тест: Создание визита
# Проверяет что можно создать новый визит

appId: ru.checkonout.mobile
---
- runFlow:
    when:
      notVisible: "Синхронизировано"
    commands:
      - tapOn: "Чек-лист инженера"
      - extendedWaitUntil:
          visible: "Войдите в систему"
          timeout: 15000

# Обработка экрана блокировки (биометрия)
- runFlow:
    when:
      visible: "Приложение заблокировано"
    commands:
      - tapOn: "Выйти из аккаунта"
      - extendedWaitUntil:
          visible: "Войдите в систему"
          timeout: 5000

# Обработка экрана логина
- runFlow:
    when:
      visible: "Войдите в систему"
    commands:
      - tapOn: "Email"
      - inputText: "testic@test.ru"
      - hideKeyboard
      - tapOn: "Пароль"
      - inputText: "hello2026"
      - hideKeyboard
      - tapOn: "Войти"

# Ожидание списка визитов
- extendedWaitUntil:
    visible: "Синхронизировано"
    timeout: 15000

# Нажатие на FAB для создания визита (правый нижний угол)
- tapOn:
    point: "83%,87%"

# Ожидание экрана нового визита
- extendedWaitUntil:
    visible: "Новый визит"
    timeout: 5000
- assertVisible: "Новый визит"

# Проверка что есть кнопка выбора адреса
- assertVisible: "Выберите адрес"

# Назад к списку
- back
- extendedWaitUntil:
    visible: "Синхронизировано"
    timeout: 5000
