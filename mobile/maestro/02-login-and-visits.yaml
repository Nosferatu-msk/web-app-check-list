# Maestro E2E тест: Логин и список визитов
# Проверяет что после логина показывается список визитов

appId: ru.checkonout.mobile
---
- clearState
- tapOn: "Чек-лист инженера"
- tapOn: "РАЗРЕШИТЬ"
- extendedWaitUntil:
    visible: "Войдите в систему"
    timeout: 15000

# Ввод email
- tapOn: "Email"
- inputText: "testic@test.ru"
- hideKeyboard

# Ввод пароля
- tapOn: "Пароль"
- inputText: "hello2026"
- hideKeyboard

# Нажатие кнопки Войти
- tapOn: "Войти"

# Обработка экрана биометрии
- extendedWaitUntil:
    visible: "Пропустить"
    timeout: 10000
- tapOn: "Пропустить"

# Ожидание загрузки списка визитов
- extendedWaitUntil:
    visible: "Синхронизировано"
    timeout: 15000
- assertVisible: "Синхронизировано"
